services:
  # ================= TESLAMATE & TELEMETRY STACK =================
  teslamate:
    image: teslamate/teslamate:latest
    container_name: teslamate
    restart: always
    environment:
      - ENCRYPTION_KEY=${TM_ENCRYPTION_KEY}
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${TM_DB_PASS}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
      - MQTT_HOST=mosquitto
    ports:
      - 4000:4000
    volumes:
      - ./import:/opt/app/import

  database:
    image: postgres:16
    container_name: teslamate-database-1
    restart: always
    environment:
      - POSTGRES_USER=teslamate
      - POSTGRES_PASSWORD=${TM_DB_PASS}
      - POSTGRES_DB=teslamate
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  grafana:
    image: teslamate/grafana:latest
    container_name: teslamate-grafana-1
    restart: always
    environment:
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${TM_DB_PASS}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
    ports:
      - 3000:3000
    volumes:
      - ./grafana-data:/var/lib/grafana

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: teslamate-mosquitto-1
    restart: always
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - 1883:1883

  teslamate-bridge:
    image: python:3.11-slim
    container_name: teslamate-teslamate-bridge-1
    restart: always
    depends_on:
      - database
      - mosquitto
    volumes:
      - ./bridge.py:/app/bridge.py
      - /dev/shm:/dev/shm
    command: sh -c "pip install paho-mqtt psycopg2-binary --quiet && python3 -u /app/bridge.py"

  # ================= STREAMING STACK (JELLYFIN & ABS) =================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: always
    ports:
      - 8096:8096
    volumes:
      - ./jellyfin-config:/config
      - ./jellyfin-cache:/cache
      - ./data/media:/media
      - /dev/shm:/dev/shm:ro

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: always
    ports:
      - 13378:80
    volumes:
      - ./data/media/audiobooks:/audiobooks
      - ./data/media/podcasts:/podcasts
      - ./abs-config:/config
      - ./abs-metadata:/metadata

  # ================= USENET & *ARR AUTOMATION STACK =================
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    ports:
      - 8080:8080
    volumes:
      - ./arr-configs/sabnzbd:/config
      - ./data/usenet:/data/usenet

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    ports:
      - 9696:9696
    volumes:
      - ./arr-configs/prowlarr:/config

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    ports:
      - 7878:7878
    volumes:
      - ./arr-configs/radarr:/config
      - ./data:/data

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    ports:
      - 8989:8989
    volumes:
      - ./arr-configs/sonarr:/config
      - ./data:/data

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: always
    environment:
      - TZ=Europe/Berlin
    ports:
      - 5055:5055
    volumes:
      - ./arr-configs/jellyseerr:/app/config
